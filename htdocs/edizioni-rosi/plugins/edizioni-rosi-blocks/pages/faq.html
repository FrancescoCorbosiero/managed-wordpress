<!-- wp:edizioni-rosi/faq-section {"title":"Domande Frequenti","subtitle":"Tutto quello che devi sapere su Edizioni Rosi e i nostri servizi editoriali.","items":[{"question":"Come posso acquistare i vostri libri?","answer":"Tutti i nostri libri sono disponibili su Amazon, sia in formato cartaceo che eBook Kindle. Clicca sulla copertina nel nostro catalogo per essere reindirizzato direttamente alla pagina di acquisto."},{"question":"Come posso proporre un manoscritto?","answer":"Inviaci il tuo manoscritto via email a edizionirosi@gmail.com. Accettiamo proposte in ogni genere letterario. Il nostro team editoriale valuterà la proposta e ti risponderà entro 30 giorni lavorativi."},{"question":"Quali generi letterari pubblicate?","answer":"Pubblichiamo saggistica, narrativa, poesia e opere di pensiero critico. Siamo particolarmente interessati a voci indipendenti e tematiche originali che sfidano il pensiero convenzionale."},{"question":"Offrite servizi di editing e correzione bozze?","answer":"Sì, ogni opera pubblicata con Edizioni Rosi viene sottoposta a un processo completo di editing professionale, correzione bozze, impaginazione e progettazione grafica della copertina."},{"question":"Pubblicate anche in formato eBook?","answer":"Sì, tutti i nostri titoli sono disponibili sia in formato cartaceo che digitale su Amazon Kindle. Stiamo valutando l'espansione ad altre piattaforme digitali."},{"question":"Quanto tempo richiede il processo di pubblicazione?","answer":"Dal momento dell'accettazione del manoscritto, il processo completo di editing, impaginazione e pubblicazione richiede in media 3-6 mesi, a seconda della complessità dell'opera."},{"question":"Posso contattarvi per collaborazioni o eventi?","answer":"Certamente! Scriveteci a edizionirosi@gmail.com o contattateci attraverso i nostri canali social. Siamo aperti a collaborazioni editoriali, presentazioni di libri e partecipazione a fiere del libro."}]} /-->
